<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jonathan | Video Editor</title>
  <meta name="description" content="Jonathan, video editor. Turning raw GTA footage into good and clean edits.">
  <meta name="theme-color" content="#14264d">
  <meta property="og:title" content="Jonathan | Video Editor">
  <meta property="og:description" content="Turning raw GTA footage into good and clean edits.">
  <meta property="og:image" content="Profile.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">

  <style>
    /* ------------------------------------------------------------------
       TIP: to use the real Pricedown font (GTA), add the font file to the
       project and uncomment the block below. It is already first in the
       --font-display list, so it will be picked up automatically.

       @font-face {
         font-family: "Pricedown";
         src: url("pricedown.woff2") format("woff2");
         font-display: swap;
       }
       Without the file, the site falls back to "Lilita One".
    ------------------------------------------------------------------- */

    :root {
      /* Palette pulled from the Batman reference art */
      --charcoal-top: #2c2d31;     /* gradient backdrop of the character sheet */
      --charcoal: #17181b;
      --black: #08090b;
      --panel: #202228;
      --gold: #ffc61a;             /* utility belt */
      --gold-deep: #d89b00;
      --cape: #2c64a8;             /* comic cape blue */
      --night: #14264d;            /* deep night blue */
      --slate: #3d4b6e;            /* cowl slate blue */
      --dusk: #8b92c2;             /* moonlit sky, used for quiet text */
      --text: #eef0f6;

      --cut: 14px;

      --font-display: "Pricedown", "Lilita One", "Arial Black", sans-serif;
      --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 85% -10%, rgba(44, 100, 168, .40), transparent 70%),
        linear-gradient(180deg, var(--charcoal-top) 0%, var(--charcoal) 55%, var(--black) 100%);
      background-attachment: fixed;
    }

    .wrap {
      width: min(1180px, 100% - 2rem);
      margin-inline: auto;
    }

    /* ---------- Angled corners (GTA-style UI boxes) ---------- */
    .cut {
      clip-path: polygon(
        var(--cut) 0, 100% 0,
        100% calc(100% - var(--cut)),
        calc(100% - var(--cut)) 100%,
        0 100%, 0 var(--cut)
      );
    }

    /* ---------- Header ---------- */
    .hero { padding: 1.5rem 0 1.25rem; }

    .hero-box {
      padding: 3px;
      background: var(--gold);
    }

    .hero-inner {
      --cut: 12px;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 1.5rem;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: linear-gradient(120deg, var(--night) 0%, var(--charcoal) 75%);
    }

    .portrait {
      --cut: 18px;
      width: 180px;
      aspect-ratio: 1;
      padding: 3px;
      background: var(--gold);
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      background: var(--night);
      clip-path: polygon(
        16px 0, 100% 0, 100% calc(100% - 16px),
        calc(100% - 16px) 100%, 0 100%, 0 16px
      );
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.1rem, 5.2vw, 3.8rem);
      line-height: 1.02;
      letter-spacing: .01em;
      color: var(--gold);
      -webkit-text-stroke: 1px #000;
      paint-order: stroke fill;
      text-shadow:
        3px 3px 0 var(--cape),
        6px 6px 0 #000;
      animation: stamp .55s cubic-bezier(.2, 1.4, .4, 1) both;
    }

    @keyframes stamp {
      from { opacity: 0; transform: scale(1.12) rotate(-1.5deg); }
      to   { opacity: 1; transform: none; }
    }

    .subtitle {
      margin: .85rem 0 0;
      max-width: 48ch;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--dusk);
    }

    /* ---------- Contact buttons ---------- */
    .contacts {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      margin-top: 1.1rem;
    }

    .btn {
      --cut: 10px;
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      padding: .75rem 1.2rem;
      border: 0;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: .02em;
      text-decoration: none;
      color: #000;
      background: var(--gold);
      transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .btn svg { width: 1.25em; height: 1.25em; flex: none; fill: currentColor; }

    .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 -2px rgba(0, 0, 0, .55); }
    .btn:active { transform: translateY(0); }

    .btn-mail { background: var(--gold); color: #000; }
    .btn-mail:hover { background: #fff; }

    .btn-x { background: var(--cape); color: #fff; }
    .btn-x:hover { background: var(--gold); color: #000; }

    .btn-discord { background: var(--slate); color: #fff; }
    .btn-discord:hover { background: var(--gold); color: #000; }

    .btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    /* ---------- Mission-style video gallery ---------- */
    .gallery { padding: .5rem 0 2.5rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .mission {
      padding: 3px;
      background: var(--slate);
      transition: transform .22s ease, background .22s ease, filter .22s ease;
    }

    .mission-inner {
      --cut: 12px;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--panel);
    }

    .mission-bar {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .55rem .9rem;
      background: var(--night);
      border-bottom: 3px solid var(--slate);
      transition: background .22s ease, border-color .22s ease, color .22s ease;
    }

    /* little GTA-style map marker */
    .mission-bar::before {
      content: "";
      width: .8rem;
      height: .8rem;
      flex: none;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(255, 198, 26, .3);
      transition: background .22s ease, box-shadow .22s ease;
    }

    .mission-bar h2 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.3rem;
      letter-spacing: .02em;
    }

    .player {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .mission:hover,
    .mission:focus-within {
      transform: translateY(-6px) rotate(-.4deg);
      background: var(--gold);
      filter: drop-shadow(0 14px 0 rgba(0, 0, 0, .5));
    }

    .mission:hover .mission-bar,
    .mission:focus-within .mission-bar {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
    }

    .mission:hover .mission-bar::before,
    .mission:focus-within .mission-bar::before {
      background: var(--night);
      box-shadow: 0 0 0 3px rgba(20, 38, 77, .3);
    }

    /* ---------- Footer ---------- */
    footer {
      padding: 1.5rem 0 2rem;
      text-align: center;
      color: var(--dusk);
      font-size: .9rem;
      border-top: 1px solid rgba(139, 146, 194, .2);
    }

    /* ---------- Copy toast ---------- */
    .toast {
      --cut: 10px;
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      transform: translate(-50%, 140%);
      padding: .7rem 1.2rem;
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: #000;
      background: var(--gold);
      transition: transform .3s cubic-bezier(.2, 1.3, .4, 1);
      z-index: 10;
    }
    .toast.show { transform: translate(-50%, 0); }

    /* ---------- Responsive ---------- */
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; max-width: 640px; margin-inline: auto; }
    }

    @media (max-width: 640px) {
      .hero-inner {
        grid-template-columns: 96px 1fr;
        gap: 1rem;
        padding: 1rem;
      }
      .portrait { --cut: 12px; width: 96px; }
      .portrait img {
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      }
      .hero-text { display: contents; }
      .title-block { align-self: center; }
      .subtitle, .contacts { grid-column: 1 / -1; }
      .subtitle { margin-top: 0; font-size: 1.05rem; }
      .contacts { margin-top: .25rem; }
      .btn { flex: 1 1 100%; justify-content: center; }
      h1 { text-shadow: 2px 2px 0 var(--cape), 4px 4px 0 #000; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="wrap">
      <div class="hero-box cut">
        <div class="hero-inner cut">
          <div class="portrait cut">
            <img src="Profile.jpg" alt="Jonathan">
          </div>

          <div class="hero-text">
            <div class="title-block">
              <h1>Jonathan | Video Editor</h1>
            </div>
            <p class="subtitle">Turning raw GTA footage into good and clean edits.</p>

            <nav class="contacts" aria-label="Contact">
              <a class="btn btn-mail cut" href="mailto:jonathan.kusniik@gmail.com">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4.6 7H4v.8l8 5.6 8-5.6V7h-.6L12 12.2z"/></svg>
                Email
              </a>

              <a class="btn btn-x cut" href="https://x.com/jhonyvfx" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.3L5.3 21H2.2l7.2-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>
                X / Twitter
              </a>

              <button class="btn btn-discord cut" type="button" id="discord" data-user="jhonyvfx" aria-label="Copy Discord username: jhonyvfx">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 5.4A17 17 0 0 0 15.4 4l-.2.4a15.700 15.700 0 0 1 3.700 1.800 13.300 13.300 0 0 0-5-1.500 13.500 13.500 0 0 0-1.900 0 13.300 13.300 0 0 0-5 1.500A15.700 15.700 0 0 1 10.800 4.400L10.600 4a17 17 0 0 0-4.200 1.400C3.700 9.400 3 13.300 3.300 17.100a17 17 0 0 0 5.200 2.600l1.100-1.800c-.6-.2-1.200-.5-1.700-.9l.4-.3a12 12 0 0 0 10.400 0l.4.300c-.5.400-1.100.7-1.700.9l1.100 1.800a17 17 0 0 0 5.200-2.600c.4-4.400-.7-8.300-3.100-11.700zM9.300 14.800c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm5.400 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/></svg>
                Discord: jhonyvfx
              </button>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="gallery">
    <div class="wrap">
      <div class="grid">

        <article class="mission cut">
          <div class="mission-inner cut">
            <div class="mission-bar"><h2>Re-edit Ghillie Master GTA 6 News</h2></div>
            <div class="player">
              <iframe
                src="https://www.youtube-nocookie.com/embed/2mLu6PeIaLU"
                title="Mission 1 - video by Jonathan"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe>
            </div>
          </div>
        </article>

        <article class="mission cut">
          <div class="mission-inner cut">
            <div class="mission-bar"><h2>Re-edit Vanoss Gaming GTA Online Funny Moments</h2></div>
            <div class="player">
              <iframe
                src="https://www.youtube-nocookie.com/embed/m_-s-QOl-8U"
                title="Mission 2 - video by Jonathan"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe>
            </div>
          </div>
        </article>

        <article class="mission cut">
          <div class="mission-inner cut">
            <div class="mission-bar"><h2>Re-edit Smii7Y Playing with viewers</h2></div>
            <div class="player">
              <iframe
                src="https://www.youtube-nocookie.com/embed/sXsU-hm3DoA"
                title="Mission 3 - video by Jonathan"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe>
            </div>
          </div>
        </article>

      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">© <span id="year">2026</span> Jonathan</div>
  </footer>

  <div class="toast cut" id="toast" role="status" aria-live="polite"></div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const discordBtn = document.getElementById('discord');
    const toast = document.getElementById('toast');
    let timer;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    discordBtn.addEventListener('click', async () => {
      const user = discordBtn.dataset.user;
      try {
        await navigator.clipboard.writeText(user);
        showToast('Copied: ' + user);
      } catch (e) {
        showToast('Discord: ' + user);
      }
    });
  </script>
</body>
</html>
